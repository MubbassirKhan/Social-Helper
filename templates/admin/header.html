<!-- admin/header.html -->
<header class="fixed top-0 left-0 right-0 z-50 bg-white shadow-md px-6 py-4 mb-[15px] flex items-center justify-between">
  <!-- Mobile Toggle Button -->
  <div class="md:hidden">
    <button id="menu-toggle" onclick="toggleSidebar()" class="text-emerald-600 focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>

  <!-- Title -->
  <h2 class="text-lg font-semibold text-emerald-700 hidden md:block">Admin Dashboard</h2>

  <!-- Profile -->
  <div class="flex items-center gap-3">
    <span class="hidden sm:inline text-sm text-gray-700 font-medium">Welcome, Admin</span>
    <div class="bg-emerald-600 text-white w-10 h-10 rounded-full flex items-center justify-center font-bold">
      A
    </div>
  </div>
</header>
