<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
  <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-emerald-700">Admin Login</h2>

    {% if error %}
      <div class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/admin/admin_login" class="space-y-4">
      <div>
        <label for="username" class="block font-semibold mb-1">Username</label>
        <input type="text" id="username" name="username" class="w-full border px-3 py-2 rounded focus:outline-none focus:ring focus:ring-emerald-300" required />
      </div>
      <div>
        <label for="password" class="block font-semibold mb-1">Password</label>
        <input type="password" id="password" name="password" class="w-full border px-3 py-2 rounded focus:outline-none focus:ring focus:ring-emerald-300" required />
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded">Login</button>
    </form>
  </div>
</body>
</html>
