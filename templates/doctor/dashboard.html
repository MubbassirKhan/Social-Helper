<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Doctor Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
</head>
<body class="bg-[#fefefe] text-gray-800">
  <div class="min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 shadow-sm hidden md:flex flex-col">
      <div class="p-6 border-b border-emerald-200">
        <h1 class="text-2xl font-extrabold text-emerald-700 tracking-wide">🩺 GiftedCare</h1>
        <p class="text-sm text-gray-500 mt-1">Doctor Panel</p>
      </div>
      <nav class="flex-1 mt-6">
        <ul class="space-y-2 px-4">
          <li>
            <button id="nav-home" onclick="showComponent('home')" class="w-full text-left py-2.5 px-4 rounded-lg text-emerald-700 bg-emerald-50 font-semibold">
              Dashboard
            </button>
          </li>
          <li>
            <button id="nav-appointments" onclick="showComponent('appointments')" class="w-full text-left py-2.5 px-4 rounded-lg hover:bg-gray-100 transition">
              Appointments
            </button>
          </li>
          <li>
            <button id="nav-profile" onclick="showComponent('profile')" class="w-full text-left py-2.5 px-4 rounded-lg hover:bg-gray-100 transition">
              Profile
            </button>
          </li>
          <li>
            <button onclick="openModal()" class="w-full text-left py-2.5 px-4 rounded-lg hover:bg-red-50 text-red-600 font-semibold">
              Logout
            </button>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col">

      <!-- Header -->
      <header class="bg-white shadow-sm p-4 flex justify-between items-center md:ml-0 border-b border-gray-200">
        <h2 class="text-xl font-semibold text-emerald-700">Welcome, Dr. {{ doctor.name }}</h2>
        <button id="toggleSidebar" class="md:hidden text-gray-600 hover:text-black focus:outline-none text-2xl">☰</button>
      </header>

      <!-- Dynamic Content Area -->
      <main id="mainContent" class="p-6 space-y-10">
        {% include 'doctor/home.html' %}
      </main>

    </div>
  </div>

  <!-- Logout Modal -->
  <div id="logoutModal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50">
    <div class="bg-white p-6 rounded-xl shadow-xl w-80">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Confirm Logout</h2>
      <p class="text-sm text-gray-500 mb-4">Are you sure you want to end your session?</p>
      <div class="flex justify-end space-x-4">
        <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Cancel</button>
        <a href="/logout-doctor" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">Logout</a>
      </div>
    </div>
  </div>

  <script>
    // Sidebar toggle for mobile
    const toggleSidebar = document.getElementById("toggleSidebar");
    toggleSidebar?.addEventListener("click", () => {
      document.querySelector("aside").classList.toggle("hidden");
    });

    // Logout modal control
    function openModal() {
      document.getElementById("logoutModal").classList.replace("hidden", "flex");
    }

    function closeModal() {
      document.getElementById("logoutModal").classList.replace("flex", "hidden");
    }

    // Navigation highlight logic
    const navMap = {
      home: document.getElementById("nav-home"),
      appointments: document.getElementById("nav-appointments"),
      profile: document.getElementById("nav-profile")
    };

    async function showComponent(component) {
      try {
        const res = await fetch(`/doctor/${component}`);
        const html = await res.text();
        document.getElementById("mainContent").innerHTML = html;

        // Reset all nav buttons
        Object.values(navMap).forEach(btn => {
          btn.classList.remove("bg-emerald-50", "text-emerald-700", "font-semibold");
          btn.classList.add("hover:bg-gray-100", "text-black");
        });

        // Highlight the active one
        const active = navMap[component];
        active.classList.add("bg-emerald-50", "text-emerald-700", "font-semibold");
        active.classList.remove("hover:bg-gray-100", "text-black");
      } catch (err) {
        console.error("Failed to load component:", err);
      }
    }
  </script>
</body>
</html>
